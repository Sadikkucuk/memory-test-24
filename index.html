<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426"><meta name="description" content="24 bellek alanı, 13 çoktan seçmeli hatırlama görevi ve 11 özbildirim. Ücretsiz keşif amaçlı bellek testi.">
<meta property="og:title" content="24 Boyutlu Bellek Testi"><meta property="og:description" content="11 alanı özbildirimle, 13 alanı hatırlama görevleriyle keşfet. Geri/İleri ile 24 soruluk deneysel test."><title>24 Boyutlu Bellek Testi</title>
<style>
:root{color-scheme:dark;--bg:#071426;--panel:#10223a;--pane2:#152c46;--text:#f3f7ff;--muted:#aec1d6;--line:#33516d;--a:#4cdab5;--b:#729bff;--err:#ff818e}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse at 70% -10%,#193859 0,transparent 46%),var(--bg);color:var(--text);min-height:100svh}
main{width:min(100%,650px);margin:auto;padding:38px 18px 70px}.brand{font-size:12px;letter-spacing:.2em;color:var(--a);font-weight:800;margin-bottom:28px}.card{background:linear-gradient(165deg,rgba(23,49,74,.97),rgba(13,31,52,.96));border:1px solid #34516b;border-radius:26px;padding:26px;box-shadow:0 20px 65px #0004}
h1{font-size:clamp(30px,6vw,45px);line-height:1.08;letter-spacing:-.04em;margin:0 0 17px}h2{font-size:clamp(23px,4.5vw,33px);margin:0 0 5px;letter-spacing:-.03em}h3{font-size:18px;margin:0 0 12px}p{color:var(--muted);line-height:1.65;font-size:15px}strong{color:var(--text)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--a)}.mini{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.stat{border:1px solid var(--line);background:#0c233b;border-radius:16px;padding:16px 8px;text-align:center}.stat b{font-size:31px;color:var(--text);display:block}.stat small{font-size:11px;color:var(--muted)}
.btns{display:flex;gap:10px;margin-top:24px}.btn{font-family:inherit;border:0;color:#071426;background:var(--a);font-weight:800;border-radius:13px;padding:16px 20px;font-size:15px;cursor:pointer;min-height:50px}.btn:hover{filter:brightness(1.1)}.btn.secondary{background:#1a3853;color:#e1edfa;border:1px solid #416582}.btn:disabled{opacity:.38;cursor:not-allowed}.btn.flex{flex:1}.badge{font-size:12px;background:#193d4c;color:#73edd0;padding:7px 11px;border-radius:30px;display:inline-flex}.progress{height:7px;background:#274157;border-radius:99px;overflow:hidden;margin:13px 0 24px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--a))}.study{white-space:pre-wrap;padding:21px;background:#071b30;border:1px solid #36516a;border-radius:17px;line-height:1.8;font-size:16px;overflow-wrap:anywhere;margin-top:22px}.question{font-size:20px;line-height:1.48;font-weight:700;margin:24px 0}.options{display:grid;gap:11px}.option{border:1px solid #405771;background:#112b45;border-radius:13px;padding:15px;display:flex;gap:13px;align-items:center;cursor:pointer;line-height:1.55;font-size:15px}.option.selected{border-color:var(--a);background:#123e46}.option input{accent-color:var(--a);width:18px;height:18px;flex:none}.results{display:grid;gap:10px;margin-top:24px}.result-row{display:flex;gap:10px;border-bottom:1px solid #30475b;padding:12px 2px}.result-row .mark{font-size:18px;width:25px;flex:none}.result-row small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}.footer{font-size:12px;color:#7f98b2;line-height:1.6;margin:30px auto;text-align:center}.good{color:var(--a)}.bad{color:var(--err)}.score{font-size:65px;font-weight:900;letter-spacing:-.07em;line-height:1;color:var(--a)}.alert{background:#1c2f43;padding:14px;border-left:3px solid var(--b);border-radius:8px;color:#ccd9e7;font-size:13px;line-height:1.55}
@media(max-width:420px){.card{padding:20px}.btn{padding:13px}.stats{gap:7px}.stat b{font-size:26px}.study{font-size:14px}}
</style></head>
<body><main><div class="brand">MEMORY LAB <span style="color:#708da7">/ EXPERIMENTAL</span></div><div class="card" id="app"></div><div class="footer">Keşif amaçlı eğitim aracı. Klinik tanı, zekâ ölçümü veya standardize nöropsikolojik test değildir.<br>Veriler bu cihazda işlenir ve sunucuya gönderilmez.</div></main>
<script>
'use strict';
const QS=[{"id":"Iconic Memory","tr":"İkonik / görsel iz belleği","type":"task","study":"GÖRSEL MATRİS\n\nA   🔵   ✦   🟨   🍃\nB   ♣️   🔶   ☀️   🟣\nC   🟥   🪶   🔺   🌙\nD   🌼   🔷   ⭐   🟢\n\nHücrelerin konumlarını aklında tut. Satır harfleri şekillerin parçası değildir.","question":"C satırının ikinci sembolü hangisiydi?","options":["🔺","🪶","🔷","✦"],"right":1},{"id":"Echoic Memory","tr":"Yankısal / işitsel iz belleği","type":"self","question":"Son bir ayda, birisi beklenmedik biçimde kısa bir cümle söylediğinde, hemen ardından cümlenin tam kelime sırasını zihninden yeniden duyabildin mi?"},{"id":"Haptic Memory","tr":"Dokunsal iz belleği","type":"self","question":"Bir nesnenin yüzeyine dokunduktan hemen sonra, elini çektiğinde dokunun pürüzlü, kaygan veya kabartılı oluşunu zihninde sürdürebildin mi?"},{"id":"Short-Term Memory","tr":"Kısa süreli bellek","type":"task","study":"SAYI DİZİSİ\n\n7 — 4 — 9 — 1 — 8 — 3 — 6 — 2\n\nSayıların yerlerini ve sırasını öğren. Bir yere yazma.","question":"Dizinin beşinci ve yedinci rakamları sırasıyla hangileriydi?","options":["8 ve 3","8 ve 6","1 ve 6","9 ve 2"],"right":1},{"id":"Working Memory","tr":"Çalışma belleği","type":"task","study":"ZİHİNSEL İŞLEM\n\nBaşlangıç dizisi:\n2 — 7 — 4 — 9\n\nKural: Her sayıya 3 ekle. Ardından elde edilen diziyi ters sıraya çevir.\n\nİşlemi yalnızca zihninde yap.","question":"Ters çevrilmiş yeni dizinin soldan ikinci sayısı kaçtır?","options":["5","10","7","12"],"right":2},{"id":"Phonological Loop","tr":"Fonolojik döngü","type":"task","study":"KELİME DİZİSİ\n\nSEMA — KORAL — VERA — TUMAN — NARİN — PELİN — DOĞA\n\nSıralamayı zihninde bir kez tekrar et. Yazma.","question":"Dördüncü ve altıncı kelimeler sırasıyla hangileriydi?","options":["VERA ve DOĞA","TUMAN ve NARİN","KORAL ve PELİN","TUMAN ve PELİN"],"right":3},{"id":"Visuospatial Sketchpad","tr":"Görsel-uzamsal not defteri","type":"task","study":"DOKUZ BÖLGELİ ŞEHİR PLANI\n\nKUZEY ↑\n\nKütüphane  |  Fırın   |  Park\nEczane      |  Meydan |  Okul\nKafe          |  Banka  |  Müze\n\nYerleşimi zihninde canlandır.","question":"Meydanın güneybatısında hangi yer bulunuyordu?","options":["Müze","Eczane","Kafe","Fırın"],"right":2},{"id":"Episodic Buffer","tr":"Epizodik tampon","type":"task","study":"ÜÇ AYRI OLAY\n\n14.10 — Kemal, MAVİ DOSYAYI kafeye götürdü.\n\n14.25 — Zeynep, KIRMIZI KUTUYU bankaya götürdü.\n\n14.40 — Ali, YEŞİL ZARFI parka götürdü.\n\nKişileri, saatleri, nesneleri ve yerleri eşleştir.","question":"14.25'te gerçekleşen olayın doğru kişi–nesne–yer birleşimi hangisidir?","options":["Kemal – kırmızı kutu – kafe","Zeynep – kırmızı kutu – banka","Ali – kırmızı kutu – park","Zeynep – yeşil zarf – banka"],"right":1},{"id":"Episodic Memory","tr":"Epizodik bellek","type":"task","study":"KURGUSAL YAŞANTI\n\nÇarşamba günü saat 16.20'de Kemal, yağmurlu bir öğleden sonra küçük bir kafeye girdi. Gri palto giyiyordu. Pencere kenarına oturdu, çay sipariş etti ve kırmızı kılıflı telefonunu masaya bıraktı. Masanın yanından geçerken garsonun elinde beyaz bir tepsi vardı.","question":"Olay hangi gün, hangi saatte gerçekleşmişti?","options":["Salı, 16.20","Çarşamba, 16.20","Çarşamba, 15.20","Perşembe, 16.40"],"right":1},{"id":"Semantic Memory","tr":"Semantik bellek","type":"task","study":"HAYALÎ BİLİMSEL SÖZLÜK\n\nSOLMA: Mavi ışığa duyarlı bir ağaç türü.\n\nDAREN: Rüzgâr kuvvetini ifade eden yerel ölçü sistemi.\n\nMEZEN: Eski şehirlerde kullanılan taş kapı.\n\nTORVİ: Bir mineralden üretilen seramik malzeme.\n\nYeni kavramların anlamlarını öğren.","question":"DAREN terimi neyi ifade ediyordu?","options":["Mavi ışıkla büyüyen bir ağaç","Taş kapı türü","Rüzgâr kuvveti ölçü sistemi","Seramik malzeme"],"right":2},{"id":"Procedural Memory","tr":"Prosedürel / beceri belleği","type":"self","question":"Daha önce iyi öğrendiğin bir motor beceriye (bisiklet, klavye, enstrüman gibi) bir süre ara verdikten sonra döndüğünde, hareketleri tek tek düşünmeden yapabildin mi?"},{"id":"Perceptual Priming","tr":"Algısal hazırlama","type":"self","question":"Daha önce gördüğün bir şekli, yazı biçimini veya simgeyi tekrar gördüğünde, onu diğer yeni şekillerden daha çabuk tanıdığını fark ettin mi?"},{"id":"Conceptual Priming","tr":"Kavramsal hazırlama","type":"self","question":"Belirli bir konu hakkında okuduktan veya konuştuktan sonra, ilişkili kavramların başka bir konuşmada daha kolay aklına geldiğini fark ettin mi?"},{"id":"Classical Conditioning","tr":"Klasik koşullanma","type":"self","question":"Geçmişte rahatsız edici bir haberle eşleşen belirli bir bildirim sesi, benzer bir haber gelmediğinde bile sende otomatik bir tepki oluşturdu mu?"},{"id":"Habituation","tr":"Alışma","type":"self","question":"Sürekli çalışan bir klima, fan veya saat sesi varken, bir süre sonra aynı ses devam etmesine rağmen onu fark etmemeye başladığın oldu mu?"},{"id":"Sensitization","tr":"Duyarlılaşma","type":"self","question":"Beklenmedik yüksek bir sesten hemen sonra, normalde önemsemeyeceğin daha hafif seslere bile daha kolay irkildiğin oldu mu?"},{"id":"Autobiographical Memory","tr":"Otobiyografik bellek","type":"self","question":"Yıllar önce yaşadığın kişisel bir olayı anlatırken olayın geçtiği yeri, kişileri ve olay sırasını belirgin biçimde hatırlayabildin mi?"},{"id":"Prospective Memory","tr":"Prospektif / geleceğe yönelik bellek","type":"self","question":"Birine 'akşam arayacağım' veya 'eve dönerken şunu alacağım' diye karar verdikten sonra, alarm ya da hatırlatıcı olmadan zamanı geldiğinde bunu hatırlayabildin mi?"},{"id":"Source Memory","tr":"Kaynak belleği","type":"task","study":"TOPLANTI KAYITLARI\n\nKemal: 'Yeni plan salı başlar.'\n\nAyşe: 'Tedarikçi perşembe arayacak.'\n\nMurat: 'Bütçe on sekiz bin lira.'\n\nEsra: 'Sözleşme iki sayfa.'\n\nKimin hangi bilgiyi verdiğini hatırla.","question":"Tedarikçinin perşembe arayacağını kim söylemişti?","options":["Murat","Kemal","Esra","Ayşe"],"right":3},{"id":"Spatial Memory","tr":"Uzamsal bellek","type":"task","study":"BİR ÇALIŞMA ODASI\n\nKapı: Güney\nMasa: Merkez\nDolap: Kuzeydoğu\nPencere: Batı\nBitki: Güneybatı\nKitaplık: Kuzeybatı\nLamba: Doğu\n\nOdanın zihinsel haritasını oluştur.","question":"Kitaplık, odanın ortasındaki masaya göre hangi yöndeydi?","options":["Kuzeybatı","Güneydoğu","Kuzeydoğu","Batı"],"right":0},{"id":"Emotional Memory","tr":"Duygusal bellek","type":"self","question":"Yoğun sevinç, korku veya üzüntü yaşadığın bir olayı daha sonra hatırlarken olayla ilişkili görüntü, ses ya da bağlam ayrıntılarının canlandığı oldu mu?"},{"id":"Retrospective Memory","tr":"Geçmiş bilgi belleği","type":"task","study":"DÜNKÜ İŞ NOTU (KURGUSAL)\n\nMert'e üç mavi klasör teslim edilecek. Teslimat saat 11.30'da, binanın ikinci katında yapılacak. Şifreli USB ise cuma getirilecek. Teslimat sonrasında sarı bir tutanak imzalanacak.\n\nNotun ayrıntılarını hatırla.","question":"Klasör teslimatı hangi katta yapılacaktı?","options":["Birinci kat","Dördüncü kat","İkinci kat","Üçüncü kat"],"right":2},{"id":"Gist Memory","tr":"Öz / anlam belleği","type":"task","study":"BİR PROJE VAKASI\n\nBir yazılım şirketi, müşterinin ihtiyaçlarını tam anlamadan yeni bir uygulama geliştirdi. Geliştiriciler hızlı çalıştı, yazılım zamanında yayımlandı ve teknik testlerden geçti. Ancak kullanıcılara sunulduğunda uygulamanın asıl iş sorununu çözmediği anlaşıldı. Ürün teknik olarak çalışmasına rağmen beklenen faydayı sağlayamadı.\n\nTek tek kelimelerden çok olayın ana anlamını değerlendir.","question":"Bu vakadan çıkarılabilecek en temel anlam hangisidir?","options":["Yazılımın zamanında yayımlanması başarının tek koşuludur.","Tüm teknik testleri geçen ürünler iş sorunlarını mutlaka çözer.","Müşterinin ihtiyaçlarını anlamak geliştirme hızından bağımsızdır.","Teknik açıdan doğru çalışan bir ürün, gerçek ihtiyaç doğrulanmadığında başarısız olabilir."],"right":3},{"id":"Verbatim Memory","tr":"Ayrıntı / sözcüğü sözcüğüne bellek","type":"task","study":"KEMAL'İN SÖZÜ\n\n“İş değiştirmeye karar vermedim; yalnızca iki görüşme yaptım.”\n\nKelimelerin tam biçimine, olumsuzluk ekine ve görüşme sayısına dikkat et.","question":"Kemal'in söylediği cümle aşağıdakilerden hangisiydi?","options":["İş değiştirmeye karar verdim; yalnızca iki görüşme yaptım.","İş değiştirmeye karar vermedim; yalnızca iki görüşme yaptım.","İş değiştirmeye karar vermedim; üç görüşme yaptım.","İş değiştirmek istemiyorum; yalnızca iki görüşme yaptım."],"right":1}];
const FREQ=['Hiç veya neredeyse hiç','Nadiren','Sıklıkla','Hemen her zaman'];
const state={step:-1,answers:{},viewed:{}};const app=document.getElementById('app');
function esc(v){return String(v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
const tasks=QS.filter(x=>x.type==='task').length;
function score(){return QS.reduce((s,q,i)=>s+(q.type==='task'&&state.answers[i]===q.right?1:0),0)}
function go(n){state.step=n;render();window.scrollTo({top:0,behavior:'instant'})}
function pick(i){state.answers[state.step]=i;renderOptions();}
function renderOptions(){const opts=app.querySelectorAll('.option');opts.forEach((node,i)=>{const selected=state.answers[state.step]===i;node.classList.toggle('selected',selected);node.querySelector('input').checked=selected});const next=document.getElementById('next');if(next)next.disabled=state.answers[state.step]===undefined;}
function render(){let s=state.step;if(s<0){app.innerHTML=`<span class="eyebrow">24 boyutlu deneysel test</span><h1>Hafızan nasıl çalışıyor?</h1><p>Görsel, sözel, mekânsal ve anlam belleğini keşfet. Bazı aşamalarda önce içeriği inceleyip kapatacaksın; sonra çoktan seçmeli soruyu hafızandan yanıtlayacaksın.</p><div class="stats"><div class="stat"><b>24</b><small>Alan</small></div><div class="stat"><b>13</b><small>Puanlı görev</small></div><div class="stat"><b>11</b><small>Özbildirim</small></div></div><div class="alert">Önemli: Bu test klinik veya standardize bir ölçüm değildir. Bazı bellek türleri yalnızca özbildirimle ele alınır; bunlardan doğru/yanlış puanı üretilmez.</div><p class="mini">Gizlilik: Ad, e-posta veya telefon istenmez. Yanıtlar yalnızca bu sayfanın geçici belleğinde hesaplanır; siteye gönderilmez veya kalıcı olarak saklanmaz. İstersen sonuçlarını kendin indirebilir veya kopyalayabilirsin.</p><p><strong>Kurallar:</strong> İnceleme bölümünü okuyup “Soruyu Aç”a bas. Önceki bilgiyi tekrar açma; dışarıdan not alma. Sonuçlar en sonda gösterilir. Geri/İleri ile yanıtlarını değiştirebilirsin.</p><button class="btn" style="width:100%" id="start">Teste başla →</button>`;document.getElementById('start').onclick=()=>go(0);return}
if(s>=QS.length){renderResults();return}
const q=QS[s],studying=q.type==='task'&&!state.viewed[s];const head=`<span class="eyebrow">SORU ${s+1} / ${QS.length} · ${q.type==='task'?'HATIRLAMA':'ÖZBİLDİRİM'}</span><div class="progress"><i style="width:${(s+1)/QS.length*100}%"></i></div><h2>${esc(q.id)}</h2><p style="margin-top:0">${esc(q.tr)}</p>`;
if(studying){app.innerHTML=head+`<div class="badge">İnceleme aşaması</div><div class="study">${esc(q.study)}</div><p>Hazır olduğunda soruya geç. Bu içerik tekrar gösterilmeyecek.</p><div class="btns"><button class="btn secondary" id="back">← Geri</button><button class="btn flex" id="reveal">Soruyu aç →</button></div>`;document.getElementById('back').onclick=()=>go(s-1);document.getElementById('reveal').onclick=()=>{state.viewed[s]=true;render()};return}
const options=q.type==='self'?FREQ:q.options;
app.innerHTML=head+`<div class="question">${esc(q.question)}</div><div class="options">${options.map((o,i)=>`<label class="option ${state.answers[s]===i?'selected':''}"><input name="q" type="radio" value="${i}" ${state.answers[s]===i?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div><div class="btns"><button class="btn secondary" id="back">← Geri</button><button class="btn flex" id="next" ${state.answers[s]===undefined?'disabled':''}>${s===QS.length-1?'Sonuçları göster':'İleri →'}</button></div>`;
app.querySelectorAll('.option').forEach((o,i)=>o.onclick=()=>pick(i));document.getElementById('back').onclick=()=>go(s-1);document.getElementById('next').onclick=()=>go(s+1);
}
function renderResults(){const sc=score(),pct=(100*sc/tasks).toFixed(1).replace('.',',');const rows=QS.map((q,i)=>{const self=q.type==='self',ok=state.answers[i]===q.right;return `<div class="result-row"><span class="mark ${self?'':ok?'good':'bad'}">${self?'—':ok?'✓':'✕'}</span><div><strong>${i+1}. ${esc(q.id)}</strong><small>${self?'Özbildirim: '+esc(FREQ[state.answers[i]]):ok?'Doğru cevap':'Yanlış · Doğrusu: '+esc(q.options[q.right])}</small></div></div>`}).join('');app.innerHTML=`<span class="eyebrow">TEST TAMAMLANDI</span><h1>Senin bellek profilin</h1><div class="score">%${pct}</div><p><strong>${sc} doğru / ${tasks-sc} yanlış</strong> · ${tasks} puanlı soru. Ek olarak 11 özbildirim tamamlandı.</p><div class="alert">Yüzde yalnızca bu kısa, yazılı hatırlama görevleri üzerindeki başarını gösterir. Bellek gücü, zekâ veya klinik norm değildir. Özbildirimlerde yüksek sıklık “yüksek bellek” olarak yorumlanmaz.</div><h3 style="margin-top:25px">24 alanın tamamı</h3><div class="results">${rows}</div><div class="btns" style="flex-wrap:wrap"><button class="btn flex" id="story">Instagram Story görselini indir</button><button class="btn secondary flex" id="copy">Sonuçları kopyala</button></div><div class="btns"><button class="btn secondary flex" id="share">Test bağlantısını paylaş</button><button class="btn secondary flex" id="restart">Yeniden başla</button></div><p class="mini">Instagram'da bağlantının çalışması için hikâyene ayrıca Bağlantı (Link) çıkartması eklemen gerekir.</p>`;document.getElementById('restart').onclick=()=>{state.step=-1;state.answers={};state.viewed={};render()};document.getElementById('story').onclick=makeStory;document.getElementById('copy').onclick=copyResults;document.getElementById('share').onclick=shareUrl;}
async function copyResults(){const str=QS.map((q,i)=>`${i+1}. ${q.id}: ${q.type==='self'?FREQ[state.answers[i]]:(state.answers[i]===q.right?'Doğru':'Yanlış')}`).join('\n')+`\nToplam: ${score()}/${tasks}`;try{await navigator.clipboard.writeText(str);alert('Sonuçlar kopyalandı.')}catch(e){prompt('Metni buradan kopyala:',str)}}
async function shareUrl(){const url=location.href.split('#')[0].split('?')[0];if(location.protocol==='file:'){alert('Önce siteyi GitHub Pages veya Lovable üzerinden yayımla. Böylece gerçek bağlantıyı paylaşabilirsin.');return}if(navigator.share){try{await navigator.share({title:'24 Boyutlu Bellek Testi',url})}catch(e){}}else{try{await navigator.clipboard.writeText(url);alert('Test bağlantısı kopyalandı.')}catch(e){prompt('Test URL',url)}}}
function roundRect(ctx,x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
function makeStory(){const c=document.createElement('canvas');c.width=1080;c.height=1920;const g=c.getContext('2d');let grad=g.createLinearGradient(0,0,1080,1920);grad.addColorStop(0,'#071225');grad.addColorStop(.55,'#123151');grad.addColorStop(1,'#071c32');g.fillStyle=grad;g.fillRect(0,0,1080,1920);g.fillStyle='#27beaa';g.beginPath();g.arc(950,160,310,0,Math.PI*2);g.globalAlpha=.12;g.fill();g.globalAlpha=1;g.fillStyle='#9fc8e4';g.font='bold 31px Arial';g.fillText('MEMORY LAB  /  24 DIMENSIONS',85,320);g.fillStyle='white';g.font='bold 74px Arial';g.fillText('BELLEK',80,450);g.fillText('TESTİ',80,535);roundRect(g,74,600,932,660,48,'#142d4b');g.fillStyle='#68edca';g.font='bold 185px Arial';g.textAlign='center';g.fillText(`${score()}/${tasks}`,540,870);g.font='bold 47px Arial';g.fillStyle='white';g.fillText('DOĞRU CEVAP',540,947);g.fillStyle='#a9c9df';g.font='39px Arial';g.fillText(`${tasks-score()} yanlış  ·  11 özbildirim`,540,1044);g.strokeStyle='#2d4a64';g.lineWidth=32;g.beginPath();g.arc(540,1400,90,0,2*Math.PI);g.stroke();g.strokeStyle='#61e5c1';g.lineCap='round';g.beginPath();g.arc(540,1400,90,-Math.PI/2,-Math.PI/2+2*Math.PI*score()/tasks);g.stroke();g.fillStyle='white';g.font='bold 35px Arial';g.fillText(`${(100*score()/tasks).toFixed(1).replace('.',',')}%`,540,1415);g.font='bold 48px Arial';g.fillText('SEN DE TEST ET',540,1640);g.fillStyle='#a9c9df';g.font='29px Arial';g.fillText('Link çıkartmasına dokun',540,1695);g.font='25px Arial';g.fillText('Deneysel test · Klinik değerlendirme değildir',540,1800);const a=document.createElement('a');a.download='bellek-testi-story.png';a.href=c.toDataURL('image/png');a.click()}
